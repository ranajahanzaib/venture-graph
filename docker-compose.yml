services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: venturegraph
      POSTGRES_USER: venturegraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venturegraph}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturegraph -d venturegraph"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://venturegraph:${POSTGRES_PASSWORD:-venturegraph}@db:5432/venturegraph
      RUST_LOG: info
      CORS_ORIGINS: http://localhost:15173
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      db: { condition: service_healthy }
  web:
    image: node:latest
    working_dir: /repo
    volumes: [".:/repo", "/repo/node_modules"]
    command: sh -c "npm install --global pnpm@latest && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:18080
    ports: ["127.0.0.1:15173:5173"]
    depends_on: [api]
volumes:
  pgdata:
